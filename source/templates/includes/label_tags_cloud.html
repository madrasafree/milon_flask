<div class="table">
    <div id="tagsCloud">
        <ul>
            {% for label_data_dict in label_data_dicts %}
                <li list-style="{{label_data_dict['style_string']}}" title="{{label_data_dict['title']}}">
                    <a href="{{label_data_dict['href']}}">{{label_data_dict['name']}}</a>
                </li>
            {% endfor %}
        </ul>
    </div>
</div>


<div id="showTime" onclick="location.href='clock.asp';" style="cursor:pointer;">
    <span id="clock" dir="LTR">
        <span id="HH"></span><span id="MM"></span>
    </span>
    <span id="taatiklock"></span>
</div>

<script src="{{ url_for('static', filename='javascript/saa3a.js') }}"></script>
